<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20113f"><title>Pixel Arcade</title>
<style>
:root{color-scheme:dark;--gold:#f7d154;--cream:#fff7d6;--ink:#100820}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 10%,#6740b8 0,#2f185c 38%,#100820 100%);color:var(--cream);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.arcade{width:min(1240px,100%);padding:clamp(22px,5vw,52px);background:#100820ed;border:5px solid var(--gold);box-shadow:12px 14px #07030e,0 28px 90px #0008}header{text-align:center}.logo{position:relative;width:76px;height:52px;margin:0 auto 18px;background:#5730a8;border:7px solid #08040f;box-shadow:inset 20px 0 #ff7a59,inset -20px 0 #8bc34a}.logo:after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);background:var(--gold);box-shadow:-11px 0 var(--gold),11px 0 var(--gold),0 -11px #39d9c8,0 11px #8bd450}h1{margin:0;color:var(--gold);font-size:clamp(34px,7vw,72px);line-height:.94;letter-spacing:.04em;text-shadow:5px 5px #090415}header p{margin:18px auto 30px;color:#c9bde7;font-weight:700;letter-spacing:.12em}.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.game-card{position:relative;display:flex;min-height:300px;flex-direction:column;justify-content:flex-end;padding:22px;color:#16111f;border:5px solid var(--cream);text-decoration:none;overflow:hidden;box-shadow:inset 0 -12px #140a2b3d,7px 8px #090415;transition:transform .12s,filter .12s}.game-card:hover,.game-card:focus-visible{transform:translate(-3px,-3px);filter:brightness(1.08);outline:3px solid var(--gold);outline-offset:4px}.game-card.flappy{background:linear-gradient(#70c5ce 0 58%,#ded895 58%)}.game-card.zombie{background:linear-gradient(#26351f 0 58%,#8bc34a 58%)}.game-card.hop{background:linear-gradient(155deg,#90f2e8 0 42%,#585d75 42% 59%,#5fce76 59%)}.game-card.farm{background:linear-gradient(#9fd7b5 0 48%,#d8b876 48% 56%,#78b957 56%)}.scene{position:absolute;inset:0}.bird{position:absolute;left:22%;top:34%;width:62px;height:42px;background:#ffd54f;border:6px solid #16111f;border-radius:45%}.bird:after{content:'';position:absolute;right:-22px;top:11px;border:12px solid transparent;border-left-color:#ff7a59}.pipe{position:absolute;right:18%;top:0;width:42px;height:42%;background:#79c64a;border:5px solid #234f23;box-shadow:0 180px 0 #79c64a}.grave{position:absolute;left:18%;bottom:43%;width:72px;height:86px;border:6px solid #172012;border-radius:38px 38px 0 0;background:#a9b29f}.zombie-head{position:absolute;right:17%;bottom:47%;width:65px;height:65px;background:#93bd62;border:6px solid #172012;box-shadow:-10px 55px #563d2d}.road{position:absolute;left:0;right:0;top:42%;height:19%;background:#555b6e;border-block:5px solid #fff3}.runner{position:absolute;left:22%;bottom:29%;width:42px;height:54px;background:#ffd166;border:5px solid #202338;box-shadow:0 -30px 0 -7px #ffd166}.barn{position:absolute;left:13%;bottom:40%;width:96px;height:76px;background:#b9503d;border:6px solid #4f3326}.barn:before{content:'';position:absolute;left:-12px;top:-52px;border:54px solid transparent;border-bottom-color:#7d472d}.barn:after{content:'';position:absolute;left:31px;bottom:0;width:28px;height:43px;background:#6b4632;border:4px solid #fff4cf}.crops{position:absolute;right:10%;bottom:29%;width:105px;height:55px;background:repeating-linear-gradient(90deg,#8b5a3c 0 16px,#6f472f 16px 21px);border:4px solid #5b3b2a}.crops:after{content:'♣ ♣ ♣';position:absolute;left:5px;top:-31px;color:#387b35;font-size:27px;letter-spacing:3px}.tag{position:relative;align-self:flex-start;padding:5px 8px;background:#16111f;color:var(--cream);font-size:10px;font-weight:900;letter-spacing:.08em}.game-card h2{position:relative;margin:8px 0 2px;font-size:clamp(20px,2.3vw,31px);line-height:.9}.game-card p{position:relative;margin:6px 0 0;font-weight:1000}.game-card.farm h2{color:#173c2f}.game-card.farm .tag{background:#173c2f}.game-card.farm p{color:#173c2f}
@media(max-width:1050px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:610px){body{padding:12px}.arcade{padding:18px}.games{grid-template-columns:1fr}.game-card{min-height:210px}.game-card h2{font-size:25px}header p{font-size:11px}.bird{top:22%}.grave{bottom:35%}.road{top:35%}.barn{bottom:32%}.crops{bottom:22%}}
</style></head>
<body><main class="arcade"><header><div class="logo" aria-hidden="true"></div><h1>PIXEL<br>ARCADE</h1><p>FOUR GAMES · ONE ARCADE</p></header><section class="games" aria-label="Choose a game">
<a id="play-flappy" class="game-card flappy" href="/flappy/"><span class="scene" aria-hidden="true"><span class="bird"></span><span class="pipe"></span></span><span class="tag">REFLEX ARCADE</span><h2>FLAPPY CANVAS</h2><p>FLY NOW →</p></a>
<a id="play-zombie" class="game-card zombie" href="/zombie-defense/"><span class="scene" aria-hidden="true"><span class="grave"></span><span class="zombie-head"></span></span><span class="tag">TACTICAL DEFENSE</span><h2>ZOMBIE DEFENSE</h2><p>HOLD THE LINE →</p></a>
<a id="play-road-hop" class="game-card hop" href="/road-hop/"><span class="scene" aria-hidden="true"><span class="road"></span><span class="runner"></span></span><span class="tag">3D ENDLESS HOPPER</span><h2>ROAD HOP</h2><p>CROSS THE CHAOS →</p></a>
<a id="play-farmstead" class="game-card farm" href="/farmstead/"><span class="scene" aria-hidden="true"><span class="barn"></span><span class="crops"></span></span><span class="tag">2.5D FARM SIM</span><h2>HARVEST HOLLOW</h2><p>GROW THE FARM →</p></a>
</section></main><script>window.__errors=[];addEventListener('error',e=>window.__errors.push(String(e.error||e.message)));addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason)));</script></body></html>
