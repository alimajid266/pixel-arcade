<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20113f">
<title>Pixel Arcade</title>
<style>
:root{color-scheme:dark;--purple:#2f185c;--gold:#f7d154;--ink:#100820;--cream:#fff7d6;--flappy:#ff7a59;--zombie:#8bc34a;--hop:#39d9c8}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 10%,#6740b8 0,#2f185c 38%,#100820 100%);color:var(--cream);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.arcade{width:min(1180px,100%);padding:clamp(22px,5vw,52px);background:rgba(16,8,32,.93);border:5px solid var(--gold);box-shadow:12px 14px 0 #07030e,0 28px 90px #0008}header{text-align:center}.logo{position:relative;width:76px;height:52px;margin:0 auto 18px;background:#5730a8;border:7px solid #08040f;box-shadow:inset 20px 0 var(--flappy),inset -20px 0 var(--zombie)}.logo:after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);background:var(--gold);box-shadow:-11px 0 var(--gold),11px 0 var(--gold),0 -11px var(--hop),0 11px var(--hop)}h1{margin:0;color:var(--gold);font-size:clamp(34px,7vw,72px);line-height:.94;letter-spacing:.04em;text-shadow:5px 5px 0 #090415}header p{margin:18px auto 30px;color:#c9bde7;font-weight:700;letter-spacing:.12em}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.game-card{position:relative;display:flex;min-height:310px;flex-direction:column;justify-content:flex-end;padding:25px;color:#16111f;border:5px solid var(--cream);text-decoration:none;overflow:hidden;box-shadow:inset 0 -12px #140a2b3d,7px 8px 0 #090415;transition:transform .12s,filter .12s}.game-card:hover,.game-card:focus-visible{transform:translate(-3px,-3px);filter:brightness(1.08);outline:3px solid var(--gold);outline-offset:4px}.game-card.flappy{background:linear-gradient(#70c5ce 0 58%,#ded895 58%)}.game-card.zombie{background:linear-gradient(#26351f 0 58%,#8bc34a 58%)}.game-card.hop{background:linear-gradient(155deg,#90f2e8 0 42%,#585d75 42% 59%,#5fce76 59%)}.scene{position:absolute;inset:0}.bird{position:absolute;left:22%;top:28%;width:62px;height:44px;background:#ffd43b;border:7px solid #16111f;border-radius:45%;box-shadow:10px 11px 0 #0003}.bird:after{content:'';position:absolute;right:-24px;top:8px;border-left:25px solid #ff784f;border-top:10px solid transparent;border-bottom:10px solid transparent}.pipe{position:absolute;right:18%;top:0;width:58px;height:47%;background:#73bf2e;border:7px solid #193c14;box-shadow:inset 9px 0 #a4e84c}.grave{position:absolute;left:17%;top:22%;width:62px;height:100px;border-radius:28px 28px 0 0;background:#9ca79b;border:7px solid #182116}.zombie-head{position:absolute;right:18%;top:27%;width:72px;height:70px;background:#85b66f;border:7px solid #182116;box-shadow:10px 10px 0 #0003}.zombie-head:after{content:'••';position:absolute;inset:12px 0 auto;text-align:center;font-size:28px;color:#301e40;letter-spacing:12px}.road{position:absolute;left:-15%;top:21%;width:130%;height:122px;background:#4f5368;transform:rotate(-18deg);border-block:7px solid #e7e0b7}.runner{position:absolute;left:40%;top:22%;width:62px;height:68px;background:#7b45da;border:7px solid #20113f;box-shadow:9px 10px 0 #0004}.runner:before{content:'';position:absolute;left:8px;top:10px;width:34px;height:14px;background:#55f3dd;border:4px solid #20113f}.runner:after{content:'';position:absolute;left:-7px;bottom:-20px;width:23px;height:18px;background:#f7d154;box-shadow:46px 0 #f7d154}.tag{position:relative;align-self:flex-start;padding:6px 9px;background:#16111f;color:#fff7d6;font-size:11px;font-weight:900;letter-spacing:.1em}.game-card h2{position:relative;margin:12px 0 4px;font-size:clamp(22px,2.6vw,34px);line-height:.9}.game-card p{position:relative;margin:7px 0 0;font-weight:1000;letter-spacing:.08em}@media(max-width:900px){.games{grid-template-columns:1fr}.game-card{min-height:230px}}@media(max-width:520px){body{padding:12px}.arcade{padding:20px 16px;border-width:4px;box-shadow:7px 8px 0 #07030e}.game-card{min-height:210px}}
</style>
</head>
<body>
<main class="arcade">
<header><div class="logo" aria-hidden="true"></div><h1>PIXEL<br>ARCADE</h1><p>THREE GAMES · ONE ARCADE</p></header>
<section class="games" aria-label="Choose a game">
<a id="play-flappy" class="game-card flappy" href="/flappy/"><span class="scene" aria-hidden="true"><span class="bird"></span><span class="pipe"></span></span><span class="tag">REFLEX ARCADE</span><h2>FLAPPY CANVAS</h2><p>FLY NOW →</p></a>
<a id="play-zombie" class="game-card zombie" href="/zombie-defense/"><span class="scene" aria-hidden="true"><span class="grave"></span><span class="zombie-head"></span></span><span class="tag">TACTICAL DEFENSE</span><h2>ZOMBIE DEFENSE</h2><p>HOLD THE LINE →</p></a>
<a id="play-road-hop" class="game-card hop" href="/road-hop/"><span class="scene" aria-hidden="true"><span class="road"></span><span class="runner"></span></span><span class="tag">3D ENDLESS HOPPER</span><h2>ROAD HOP</h2><p>CROSS THE CHAOS →</p></a>
</section>
</main>
<script>window.__errors=[];addEventListener('error',e=>window.__errors.push(String(e.error||e.message)));addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason)));</script>
</body>
</html>
