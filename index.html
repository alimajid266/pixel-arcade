<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f185c">
<title>Pixel Arcade</title>
<style>
:root{color-scheme:dark;--purple:#2f185c;--gold:#f7d154;--ink:#140a2b;--cream:#fff7d6;--flappy:#ff7a59;--zombie:#8bc34a}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 15%,#5730a8 0,#2f185c 38%,#140a2b 100%);color:var(--cream);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.arcade{width:min(940px,100%);padding:clamp(22px,5vw,52px);background:rgba(20,10,43,.91);border:5px solid var(--gold);box-shadow:12px 14px 0 #090415,0 28px 90px rgba(0,0,0,.45)}header{text-align:center}.logo{position:relative;width:68px;height:48px;margin:0 auto 18px;background:#5730a8;border:7px solid #08040f;box-shadow:inset 18px 0 var(--flappy),inset -18px 0 var(--zombie)}.logo:after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;transform:translate(-50%,-50%);background:var(--gold);box-shadow:-10px 0 var(--gold),10px 0 var(--gold),0 -10px var(--gold),0 10px var(--gold)}h1{margin:0;color:var(--gold);font-size:clamp(34px,7vw,72px);line-height:.94;letter-spacing:.04em;text-shadow:5px 5px 0 #090415}header p{margin:18px auto 30px;color:#c9bde7;font-weight:700;letter-spacing:.12em}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.game-card{position:relative;display:flex;min-height:300px;flex-direction:column;justify-content:flex-end;padding:26px;color:#16111f;border:5px solid var(--cream);text-decoration:none;overflow:hidden;box-shadow:inset 0 -12px rgba(20,10,43,.24),7px 8px 0 #090415;transition:transform .12s,filter .12s}.game-card:hover,.game-card:focus-visible{transform:translate(-3px,-3px);filter:brightness(1.08);outline:3px solid var(--gold);outline-offset:4px}.game-card.flappy{background:linear-gradient(#70c5ce 0 58%,#ded895 58%);}.game-card.zombie{background:linear-gradient(#26351f 0 58%,#8bc34a 58%)}.scene{position:absolute;inset:0}.bird{position:absolute;left:22%;top:28%;width:62px;height:44px;background:#ffd43b;border:7px solid #151515;border-radius:45%}.bird:before{content:'';position:absolute;right:2px;top:4px;width:13px;height:13px;background:white;border:4px solid #151515}.bird:after{content:'';position:absolute;right:-27px;top:20px;width:24px;height:10px;background:#f04e30;border:4px solid #151515}.pipe{position:absolute;right:18%;bottom:42%;width:54px;height:112px;background:#8bc34a;border:7px solid #183816;box-shadow:inset 8px 0 #b5df6a}.grave{position:absolute;left:18%;bottom:38%;width:52px;height:76px;border:7px solid #252a23;border-radius:25px 25px 4px 4px;background:#6f766a}.zombie-head{position:absolute;right:18%;top:20%;width:88px;height:108px;background:#547c38;border:8px solid #172510;border-radius:38%}.zombie-head:before{content:'';position:absolute;left:17px;top:30px;width:13px;height:13px;background:#070a06;box-shadow:35px 0 #070a06}.zombie-head:after{content:'';position:absolute;left:23px;top:70px;width:34px;height:7px;background:#26351f}.tag{position:relative;z-index:1;align-self:flex-start;padding:6px 9px;margin-bottom:10px;background:#140a2b;color:var(--cream);font-size:11px;font-weight:900}.game-card h2{position:relative;z-index:1;margin:0;font-size:clamp(24px,4vw,39px);line-height:1}.game-card p{position:relative;z-index:1;margin:10px 0 0;font-weight:900}.note{margin:28px 0 0;text-align:center;color:#a99bc9;font-size:12px;line-height:1.6}@media(max-width:700px){body{padding:14px}.arcade{padding:22px}.games{grid-template-columns:1fr}.game-card{min-height:230px}}
</style>
</head>
<body>
<main class="arcade">
<header><div class="logo" aria-hidden="true"></div><h1>PIXEL<br>ARCADE</h1><p>TWO GAMES · ONE ARCADE</p></header>
<section class="games" aria-label="Choose a game">
<a id="play-flappy" class="game-card flappy" href="/flappy/"><span class="scene" aria-hidden="true"><span class="bird"></span><span class="pipe"></span></span><span class="tag">REFLEX ARCADE</span><h2>FLAPPY CANVAS</h2><p>FLY NOW →</p></a>
<a id="play-zombie" class="game-card zombie" href="/zombie-defense/"><span class="scene" aria-hidden="true"><span class="grave"></span><span class="zombie-head"></span></span><span class="tag">TACTICAL DEFENSE</span><h2>ZOMBIE DEFENSE</h2><p>HOLD THE LINE →</p></a>
</section>

</main>
<script>window.__errors=[];addEventListener('error',e=>window.__errors.push(String(e.error||e.message)));addEventListener('unhandledrejection',e=>window.__errors.push(String(e.reason)));</script>
</body>
</html>
