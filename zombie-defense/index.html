class AudioManager{constructor(){const legacy=Storage.getBool('zombieDefenseMuted',false);this.ctx=null;this.musicMuted=Storage.getBool('zombieDefenseMusicMuted',legacy);this.sfxMuted=Storage.getBool('zombieDefenseSfxMuted',legacy);this.musicBus=null;this.sfxBus=null;this.musicStep=0;this.nextMusicTime=0;this.musicNotes=[110,130.81,146.83,130.81,98,123.47,146.83,123.47,87.31,110,130.81,110,82.41,98,123.47,98];}get muted(){return this.musicMuted&&this.sfxMuted;}unlock(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC){this.ctx=new AC();this.musicBus=this.ctx.createGain();this.sfxBus=this.ctx.createGain();this.musicBus.connect(this.ctx.destination);this.sfxBus.connect(this.ctx.destination);this.applyBusState();}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}applyBusState(){if(!this.ctx)return;const n=this.ctx.currentTime;this.musicBus.gain.setValueAtTime(this.musicMuted?0:1,n);this.sfxBus.gain.setValueAtTime(this.sfxMuted?0:1,n);}toggleMusic(){this.musicMuted=!this.musicMuted;Storage.setBool('zombieDefenseMusicMuted',this.musicMuted);this.applyBusState();}toggleSfx(){this.sfxMuted=!this.sfxMuted;Storage.setBool('zombieDefenseSfxMuted',this.sfxMuted);this.applyBusState();}toggle(){const muteBoth=!(this.musicMuted&&this.sfxMuted);this.musicMuted=muteBoth;this.sfxMuted=muteBoth;Storage.setBool('zombieDefenseMusicMuted',muteBoth);Storage.setBool('zombieDefenseSfxMuted',muteBoth);Storage.setBool('zombieDefenseMuted',muteBoth);this.applyBusState();}tone(a,b,d,v,type){if(this.sfxMuted||!this.ctx)return;const n=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(Math.max(20,b),n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(this.sfxBus);o.start(n);o.stop(n+d);}musicTone(f,start){const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,start);g.gain.setValueAtTime(.032,start);g.gain.exponentialRampToValueAtTime(.0001,start+.38);o.connect(g);g.connect(this.musicBus);o.start(start);o.stop(start+.4);}updateMusic(){if(!this.ctx||this.musicMuted||document.hidden)return;const n=this.ctx.currentTime;if(this.nextMusicTime<n-.5)this.nextMusicTime=n+.03;if(!this.nextMusicTime)this.nextMusicTime=n+.03;while(this.nextMusicTime<n+.25){this.musicTone(this.musicNotes[this.musicStep],this.nextMusicTime);this.musicStep=(this.musicStep+1)%this.musicNotes.length;this.nextMusicTime+=.4;}}fire(type){if(type==='bomb')this.tone(190,90,.12,.05,'sawtooth');else if(type==='shotgun')this.tone(180,70,.06,.05,'sawtooth');else if(type==='sniper')this.tone(560,190,.08,.04,'square');else this.tone(430,340,.025,.022,'square');}explosion(){this.tone(145,34,.24,.09,'sawtooth');this.tone(82,24,.34,.065,'square');}death(){this.tone(190,90,.13,.04,'sawtooth');}wave(){this.tone(250,520,.18,.045,'square');}boss(){this.tone(90,42,.6,.08,'sawtooth');}victory(){this.tone(330,700,.3,.06,'square');setTimeout(()=>this.tone(520,980,.28,.05,'square'),150);}defeat(){this.tone(250,75,.45,.06,'sawtooth');}}

class Zombie{constructor(type,wave){const cfg=ZOMBIES[type];this.type=type;this.wave=wave;this.boss=type==='boss';this.x=routeX[0];this.y=routeY[0];this.drawX=this.x;this.drawY=this.y;this.segment=0;this.progress=0;this.distance=0;this.speed=cfg.speed*waveSpeedMultiplier(wave);const hpScale=wave>=12?2.15:wave>=9?1.65:wave>=5?1.3:1;this.maxHp=this.boss?cfg.hp:Math.round((cfg.hp+wave*8)*hpScale);this.hp=this.maxHp;this.reward=cfg.reward+Math.max(0,((wave-1)/6)|0);this.scale=cfg.scale;this.body=cfg.body;this.accent=cfg.accent;this.lifeDamage=this.boss?5:(type==='brute'||type==='armored'?2:1);this.dead=false;this.reached=false;this.time=Math.random()*5;this.regen=type==='toxic'?14:0;this.underground=type==='burrower';this.surfaceAt=this.underground?totalRoute*(.25+Math.random()*.2):0;this.surfacing=0;}

class Tower{
 constructor(col,row,weapon){this.col=col;this.row=row;this.weapon=weapon;this.cells=[];for(let i=0;i<weapon.cells;i++)this.cells.push({col:col+i,row});this.x=(col+weapon.cells/2)*CELL;this.y=row*CELL+20;this.level=1;this.invested=weapon.cost;this.cooldown=.1;this.target=null;this.angle=-Math.PI/2;this.flash=0;}

class WaveManager{
 constructor(game){this.game=game;this.reset();}
 reset(){this.wave=0;this.active=false;this.spawned=0;this.timer=0;this.queue=null;this.records={};}
 get escaped(){let n=0;for(const key in this.records)if(!this.records[key].settled)n+=this.records[key].escaped;return n;}
 get livesLost(){let n=0;for(const key in this.records)if(!this.records[key].settled)n+=this.records[key].livesLost;return n;}

function angleDiff(a,b){let d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

function pixelWidth(text,size){let w=0;for(let i=0;i<text.length;i++)w+=(text[i]===' '?4:6)*size;return w-size;}function drawPixelCentered(ctx,text,y,size,color,shadow){drawPixelText(ctx,text,(W-pixelWidth(text,size))/2,y,size,color,shadow);}function drawPixelText(ctx,text,x,y,size,color,shadow){drawPixelPass(ctx,text,x+size,y+size,size,shadow);drawPixelPass(ctx,text,x,y,size,color);}function drawPixelPass(ctx,text,x,y,size,color){ctx.fillStyle=color;let ox=x;for(let i=0;i<text.length;i++){const mask=FONT[text[i]];if(!mask){ox+=4*size;continue;}for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(mask[r][c]==='1')ctx.fillRect(ox+c*size,y+r*size,size,size);ox+=6*size;}}function drawPixelFrame(ctx,x,y,w,h){ctx.fillStyle='#26351f';for(let xx=x;xx<x+w;xx+=20){ctx.fillRect(xx,y,12,5);ctx.fillRect(xx,y+h-5,12,5);}for(let yy=y;yy<y+h;yy+=20){ctx.fillRect(x,yy,5,12);ctx.fillRect(x+w-5,yy,5,12);}ctx.fillStyle='#8BC34A';ctx.fillRect(x,y,24,5);ctx.fillRect(x,y,5,24);ctx.fillRect(x+w-24,y,24,5);ctx.fillRect(x+w-5,y,5,24);ctx.fillRect(x,y+h-5,24,5);ctx.fillRect(x,y+h-24,5,24);ctx.fillRect(x+w-24,y+h-5,24,5);ctx.fillRect(x+w-5,y+h-24,5,24);}
